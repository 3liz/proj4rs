[package]
name = "proj4rs-clib"
version.workspace = true
edition = "2024"
description = "C bindings for proj4rs"
exclude=[
    "Makefile.toml",
]
keywords.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true


[lib]
name = "proj4rs_c"
crate-type = ["cdylib"]

[dependencies]
proj4rs = "0.2"
libc = { version = "0.2" }

[features]
crs-definitions = ["proj4rs/crs-definitions"]

# XXX Defined in workspace
#[profile.release]
#lto = true
#codegen-units = 1
#strip = "debuginfo"

[package.metadata.deb]
maintainer = "David Marteau <david.marteau@3liz.com>"
copyright = "2024, 3liz"
extended-description = """Projection library inspired from proj"""
depends = "$auto"
section = "development"
priority = "optional"
assets = [ 
    ["../target/release/libproj4rs_c.so", "usr/lib/", "755"],
    ["../target/cbindgen/proj4rs.h", "usr/include/", "644"]
]

