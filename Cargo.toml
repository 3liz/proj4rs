
[workspace]
members = [ 
    "proj4rs-geodesic",
    "proj4rs",
    "proj4rs-clib", 
    "proj4rs-php",
    "run-wasm",
]
# proj4rs-php requires the PHP development files and libclang:
# build it explicitly with `cargo build -p proj4rs-php`
default-members = [
    "proj4rs-geodesic",
    "proj4rs",
    "proj4rs-clib",
    "run-wasm",
]
resolver = "2"

[workspace.package]
keywords = ["gis", "proj", "projection", "geography", "geospatial"]
authors = ["David Marteau <dmarteau@3liz.com>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/3liz/proj4rs/"
repository = "https://github.com/3liz/proj4rs/"
categories = ["science::geo"]
version = "0.3.0"

[workspace.dependencies]
proj4rs = { path = "proj4rs" }
proj4rs-geodesic = { version = "0.2", path = "proj4rs-geodesic" }

# Get around https://github.com/image-rs/image-tiff/issues/403
[patch.crates-io]
tiff = { git = "https://github.com/dmarteau/image-tiff.git", branch = "stable-fix" }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
incremental = false
