[tasks.default]
alias = "defaults"

[tasks.defaults]
dependencies = [
    "build"
]

[tasks.build]
description = "Dev build"
command = "cargo"
args = ["build"]

[tasks.release]
description = "Release build"
command = "cargo"
args = ["build", "--release"]

[tasks.doc]
description = "Build documentation"
command = "cargo"
args = ["doc", "--all-features", "--no-deps"]

#
# WASM
#

[tasks.wasm]
description = "Build wasm module (web target)"
command = "wasm-pack"
args = [
    "build",
    "--out-dir=../js/pkg",
    "--release",
    "--target=web",
    "--features=logging",
    "--features=proj4js-compat",
    "--features=with-wasm-entrypoint",
]

# NOTE: this increase substantially the size of the wasm 
[tasks."wasm.all"]
description = "Build wasm module (web target)"
command = "wasm-pack"
args = [
    "build",
    "--out-dir=../js/pkg",
    "--release",
    "--target=web",
    "--features=tiff",
    "--features=logging",
    "--features=proj4js-compat",
    "--features=with-wasm-entrypoint",
]



[tasks."wasm.debug"]
description = "Build wasm module with logging feature (web target)"
command = "wasm-pack"
args = [
    "build", 
    "--out-dir=../js/pkg",
    "--dev",
    "--target=web",
    "--features=logging",
    "--features=proj4js-compat",
    "--features=with-wasm-entrypoint",
]

[tasks."wasm.strict"]
description = "Build wasm module in strict-mode (web target)"
command = "wasm-pack"
args = [
    "build",
    "--out-dir=../js/pkg",
    "--release",
    "--target=web",
    "--features=logging",
    "--features=wasm-strict",
    "--features=proj4js-compat",
    "--features=with-wasm-entrypoint",
]


[tasks."wasm.bundle"]
description = "Build wasm package as bundle"
command = "wasm-pack"
args = [
    "build",
    "--out-dir=../js/pkg-bundle",
    "--release",
    "--target=bundler",
    "--features=logging",
    "--features=proj4js-compat",
    "--features=with-wasm-entrypoint",
]

[tasks."wasm.node"]
description = "Build wasm package as nodejs node"
command = "wasm-pack"
args = [
    "build",
    "--out-dir=../js/pkg-node",
    "--release",
    "--target=nodejs",
    "--features=logging",
    "--features=proj4js-compat",
    "--features=with-wasm-entrypoint",
]

[tasks."npm.build"]
script = '''
#!/usr/bin/env bash
cp ../README.md ../js/proj4.js ../js/pkg-bundle
python3  << 'EOF'
import json
js = json.load(open("../js/pkg-bundle/package.json"))
js["files"].extend(("proj4rs_bg.wasm.d.ts", "proj4.js"))
json.dump(js, open("../js/pkg-bundle/package.json", "w"), indent=4)
EOF
'''
dependencies = [
    "wasm.bundle"
]

[tasks."npm.publish"]
command = "wasm-pack"
args = [
    "publish",
    "--pkg-dir=../js/pkg-bundle",
    "--target=bundler",
]

[tasks.manifest]
description = "Create build manifest"
script = """
#!/usr/bin/env bash
buildid=`date +"%Y%m%d%H%M"`
echo "commit=${CARGO_MAKE_GIT_HEAD_LAST_COMMIT_HASH_PREFIX}" > ../js/pkg/manifest
echo "buildid=$buildid" >> ../js/pkg/manifest
"""


[tasks."wasm.package"]
description = "Package wasm web module"
env = { "PROJ4RS_PACKAGE" = "${CARGO_MAKE_CRATE_FS_NAME}-${CARGO_MAKE_CRATE_VERSION}.tgz" }
dependencies = [ "manifest" ]
script = '''
#!/usr/bin/env bash
sed "s|./pkg/proj4rs.js|./proj4rs.js|" ../js/proj4.js  > ../js/pkg/proj4.js
tar -czvf ${PROJ4RS_PACKAGE}  --transform=s/pkg/${CARGO_MAKE_CRATE_FS_NAME}/ -C ../js  pkg
'''

[tasks."wasm.build.package"]
dependencies = [ "wasm", "wasm.package"]
